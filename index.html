<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <h1>Projeto web</h1>
    <div class="galery">
        <figure>
            <img src="./images/diversity_team.jpg"
                alt="Mãos de pessoas com diferentes tons de pele unidas no centro, simbolizando união, diversidade e trabalho em equipe.">
        </figure>
        <figure>
            <img src="./images/hologram.jpg"
                alt="Mulher usando óculos de realidade virtual interage com interface holográfica digital em ambiente com iluminação neon rosa.">
        </figure>
        <figure>
            <img src="./images/human_and_robot.jpg"
                alt="Dedo de mão humana tatuada tocando a ponta do dedo de um braço robótico mecânico preto, em referência à obra A Criação de Adão." />
        </figure>
        <figure>
            <img src="./images/innovation.jpg"
                alt="Braço robótico industrial oferece uma xícara branca a um homem idoso de terno que folheia documentos, simbolizando assistência tecnológica no cotidiano." />
        </figure>
    </div>
</body>

</html>
